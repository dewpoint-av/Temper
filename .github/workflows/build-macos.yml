name: Build macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS universal2 (VST3 + AU + CLAP)
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
      MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
      MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage bundles
        run: |
          mkdir -p dist
          cp -R build/Temper_artefacts/Release/VST3/Temper.vst3      dist/
          cp -R build/Temper_artefacts/Release/AU/Temper.component   dist/
          cp -R build/Temper_artefacts/Release/CLAP/Temper.clap      dist/

      # â”€â”€ Code signing & notarization â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # All signing steps self-skip when the required secrets are absent
      # (e.g. pull requests from forks), producing unsigned bundles as before.

      - name: Import signing certificates
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          set -euo pipefail

          # Homebrew OpenSSL 3.x provides the legacy PBE flags LibreSSL lacks.
          if [ -x "/opt/homebrew/opt/openssl@3/bin/openssl" ]; then
            OSSL="/opt/homebrew/opt/openssl@3/bin/openssl"
          elif [ -x "/usr/local/opt/openssl@3/bin/openssl" ]; then
            OSSL="/usr/local/opt/openssl@3/bin/openssl"
          else
            OSSL="openssl"
          fi
          echo "Using OpenSSL: $OSSL ($($OSSL version))"

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"

          # Decode, verify, legacy-re-encode and import a base64 .p12 into the keychain.
          import_p12() {
            local B64="$1" PWD="$2" NAME="$3"
            local RAW="$RUNNER_TEMP/${NAME}.p12" TMPD="$RUNNER_TEMP/${NAME}_convert"
            echo "$B64" | tr -d '\n\r ' | base64 --decode > "$RAW"
            local SZ
            SZ=$(stat -f%z "$RAW" 2>/dev/null || stat --printf="%s" "$RAW")
            echo "${NAME}: ${SZ} bytes"
            if [ "$SZ" -lt 100 ]; then
              echo "::error::${NAME} decoded too small (${SZ} bytes) â€” secret is empty or corrupted"
              exit 1
            fi

            # --- password diagnostics (never echo the password itself) ------
            local PWD_LEN=${#PWD}
            local PWD_TRIMMED
            PWD_TRIMMED=$(printf '%s' "$PWD" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            echo "${NAME}: password secret is ${PWD_LEN} characters"
            if [ -z "$PWD" ]; then
              echo "::error::${NAME} password secret is EMPTY"
            elif [ "${#PWD_TRIMMED}" -ne "$PWD_LEN" ]; then
              echo "::warning::${NAME} password secret has leading/trailing whitespace (${#PWD_TRIMMED} chars after trim) â€” re-paste it without spaces/newlines"
            fi

            # Verify with the SAME OpenSSL we re-encode with. macOS's system
            # `openssl` is LibreSSL and cannot read modern Apple-exported p12s
            # (PBES2/AES), which makes the password check fail spuriously.
            if ! $OSSL pkcs12 -in "$RAW" -passin pass:"$PWD" -legacy -nokeys -noout 2>"$RUNNER_TEMP/${NAME}_verify.log"; then
              echo "::error::${NAME} password verification failed â€” MACOS_CERTIFICATE_PWD does not match the password set when the .p12 was exported"
              echo "---- OpenSSL output ----"
              cat "$RUNNER_TEMP/${NAME}_verify.log"
              echo "------------------------"
              echo "How to fix: re-export the certificate + private key from Keychain Access as a .p12"
              echo "with a KNOWN password (the one you type into the export dialog â€” not your login"
              echo "keychain password and not your Apple ID password), then set MACOS_CERTIFICATE_PWD"
              echo "to exactly that password."
              exit 1
            fi
            mkdir -p "$TMPD"
            $OSSL pkcs12 -in "$RAW" -passin pass:"$PWD" -legacy -nokeys  -out "$TMPD/cert.pem"
            $OSSL pkcs12 -in "$RAW" -passin pass:"$PWD" -legacy -nocerts -nodes -out "$TMPD/key.pem"
            $OSSL pkcs12 -export -in "$TMPD/cert.pem" -inkey "$TMPD/key.pem" \
              -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg SHA1 \
              -passout pass:"$PWD" -out "${RAW}.legacy"
            rm -rf "$TMPD"
            if [ ! -s "${RAW}.legacy" ]; then
              echo "::error::${NAME} legacy re-encode produced empty output"
              exit 1
            fi
            mv "${RAW}.legacy" "$RAW"
            security import "$RAW" -k "$KEYCHAIN_PATH" -P "$PWD" \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
            rm -f "$RAW"
          }

          # Developer ID Application (required â€” signs the plugin bundles)
          import_p12 "$MACOS_CERTIFICATE" "$MACOS_CERTIFICATE_PWD" "app"

          # Developer ID Installer (optional â€” productsigns the .pkg)
          if [ -n "$MACOS_INSTALLER_CERTIFICATE" ]; then
            INSTALLER_PWD="${MACOS_INSTALLER_CERTIFICATE_PWD:-$MACOS_CERTIFICATE_PWD}"
            import_p12 "$MACOS_INSTALLER_CERTIFICATE" "$INSTALLER_PWD" "installer"
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$APP_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Application identity: $APP_IDENTITY"
          echo "SIGNING_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          if [ -n "$MACOS_INSTALLER_CERTIFICATE" ]; then
            INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" \
              | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ -n "$INSTALLER_IDENTITY" ]; then
              echo "Installer identity: $INSTALLER_IDENTITY"
              echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
            else
              echo "::warning::MACOS_INSTALLER_CERTIFICATE set but no 'Developer ID Installer' identity found"
            fi
          fi

      - name: Code sign bundles
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          for BUNDLE in dist/Temper.vst3 dist/Temper.component dist/Temper.clap; do
            echo "=== Signing $BUNDLE ==="
            # Sign every Mach-O binary inside-out (no entitlements â€” plugins
            # inherit host capabilities; empty hardened-runtime is all we need).
            # `file` on a universal binary prints a line PER ARCHITECTURE, so we
            # use find's path for signing and `file` only to filter (never to
            # derive the path).
            while IFS= read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                echo "  binary: $f"
                codesign --force --options runtime --timestamp \
                  --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$f"
              fi
            done < <(find "$BUNDLE" -type f -perm +111 2>/dev/null)
            codesign --force --deep --options runtime --timestamp \
              --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$BUNDLE"
            codesign --verify --deep --strict --verbose=2 "$BUNDLE"
          done

      - name: Notarize and staple bundles
        if: ${{ env.MACOS_CERTIFICATE != '' && env.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          STAGE="$RUNNER_TEMP/notarize-stage"
          ZIP="$RUNNER_TEMP/Temper-bundles.zip"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R dist/Temper.vst3 dist/Temper.component dist/Temper.clap "$STAGE/"
          ditto -c -k --keepParent "$STAGE" "$ZIP"
          ls -lh "$ZIP"

          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m 2>&1 | tee notarize_bundles.txt

          xcrun stapler staple  dist/Temper.vst3
          xcrun stapler staple  dist/Temper.component
          xcrun stapler staple  dist/Temper.clap
          xcrun stapler validate dist/Temper.vst3
          xcrun stapler validate dist/Temper.component
          xcrun stapler validate dist/Temper.clap

      - name: Create installer package (.pkg)
        run: |
          mkdir -p payload/Library/Audio/Plug-Ins/VST3
          mkdir -p payload/Library/Audio/Plug-Ins/Components
          mkdir -p payload/Library/Audio/Plug-Ins/CLAP
          cp -R dist/Temper.vst3      payload/Library/Audio/Plug-Ins/VST3/
          cp -R dist/Temper.component payload/Library/Audio/Plug-Ins/Components/
          cp -R dist/Temper.clap      payload/Library/Audio/Plug-Ins/CLAP/
          mkdir -p scripts
          printf '#!/bin/sh\nrm -rf "/Library/Audio/Plug-Ins/VST3/Temper.vst3"\nrm -rf "/Library/Audio/Plug-Ins/Components/Temper.component"\nrm -rf "/Library/Audio/Plug-Ins/CLAP/Temper.clap"\nexit 0\n' > scripts/preinstall
          chmod +x scripts/preinstall
          pkgbuild --root payload --scripts scripts --identifier com.dewpoint.Temper --version 0.2.0 --install-location / Temper-0.2.0-mac.pkg

      - name: Sign installer package (productsign)
        if: ${{ env.MACOS_CERTIFICATE != '' && env.MACOS_INSTALLER_CERTIFICATE != '' }}
        run: |
          if [ -z "${INSTALLER_IDENTITY:-}" ]; then
            echo "::error::No Developer ID Installer identity available for productsign"
            exit 1
          fi
          mv Temper-0.2.0-mac.pkg Temper-0.2.0-mac-unsigned.pkg
          productsign --sign "$INSTALLER_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            Temper-0.2.0-mac-unsigned.pkg Temper-0.2.0-mac.pkg
          rm -f Temper-0.2.0-mac-unsigned.pkg
          pkgutil --check-signature Temper-0.2.0-mac.pkg

      - name: Notarize and staple installer package
        if: ${{ env.MACOS_CERTIFICATE != '' && env.MACOS_INSTALLER_CERTIFICATE != '' && env.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit Temper-0.2.0-mac.pkg \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m 2>&1 | tee notarize_pkg.txt
          xcrun stapler staple  Temper-0.2.0-mac.pkg
          xcrun stapler validate Temper-0.2.0-mac.pkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Temper-macOS
          path: |
            dist/**
            Temper-0.2.0-mac.pkg

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP"/*.p12 2>/dev/null || true
